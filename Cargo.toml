[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Chess Database Converter"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nloding/scidtopgn"
rust-version = "1.70"

[workspace.dependencies]
# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Chess logic
shakmaty = "0.26"

# Binary parsing
byteorder = "1.5"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Testing
pretty_assertions = "1.4"
