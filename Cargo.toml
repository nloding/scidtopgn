[package]
name = "scidtopgn"
version = "0.1.0"
edition = "2021"
authors = ["Chess Database Converter"]
description = "A CLI tool to convert SCID databases (.si4/.sg4/.sn4) to PGN format"
license = "MIT OR Apache-2.0"

[lib]
name = "scidtopgn"
path = "src/lib.rs"

[[bin]]
name = "scidtopgn"
path = "src/main.rs"

[dependencies]
# Chess engine and notation
shakmaty = "0.26"
pgn-reader = "0.26"

# Error handling and utilities
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"

# Performance optimization
lru = "0.12"
object-pool = "0.5"

# Property-based testing
proptest = "1.4"
# rayon = "1.3.1"  # Requires Rust 1.80+, using std::thread instead

# Optional features
serde = { version = "1.0", features = ["derive"], optional = true }
hex = "0.4.3"


[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
