[workspace]
members = ["crates/scidtopgn", "crates/scidtopgn-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Chess Database Converter"]
license = "GPL-3.0-or-later"
repository = "https://github.com/nloding/scidtopgn"
rust-version = "1.70"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
tempfile = "3"

[package]
name = "scidtopgn-workspace"
version.workspace = true
edition.workspace = true
publish = false

[dev-dependencies]
scidtopgn = { path = "crates/scidtopgn" }
tempfile = { workspace = true }
