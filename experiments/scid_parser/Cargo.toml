[package]
name = "scid_parser"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "scid_parser"
path = "src/lib.rs"

[[bin]]
name = "scid_parser"
path = "src/main.rs"

[dependencies]
# Chess engine and notation
shakmaty = "0.26"
pgn-reader = "0.26"

# Error handling and utilities
thiserror = "1.0"
memmap2 = "0.9"

# Performance optimization
lru = "0.12"
object-pool = "0.5"
# rayon = "1.3.1"  # Requires Rust 1.80+, using std::thread instead

# Optional features
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]
