[package]
name = "scidtopgn"
version = "0.1.0"
edition = "2021"
authors = ["Chess Database Converter"]
description = "CLI tool for converting SCID chess databases to PGN format"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nloding/scidtopgn"
keywords = ["chess", "scid", "pgn", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "scidtopgn"
path = "src/main.rs"

[dependencies]
# Core library
scidtopgn-core = { path = "../core" }

# CLI framework
clap = { version = "4.4", features = ["derive", "cargo", "wrap_help"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Progress indicators
indicatif = "0.17"

# Terminal detection
atty = "0.2"

# Optional: Colorized output
colored = "2.0"

[dev-dependencies]
# CLI testing
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
